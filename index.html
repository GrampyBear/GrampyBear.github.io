<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro TV Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Sky Dynamic Background -->
    <div id="sky-bg"></div>

    <!-- TV Frame Container -->
    <div class="tv-casing" id="tv-casing">
        <div class="antenna left"></div>
        <div class="antenna right"></div>

        <div class="tv-body">
            <div class="screen-bezel">
                <div class="screen mode-default" id="tv-screen">
                    <div class="crt-overlay"></div>
                    <div class="scanlines"></div>
                    
                    <!-- Dinamic Screen Glare -->
                    <div class="screen-glare" id="screen-glare"></div>

                    <!-- Canvas for Static Noise -->
                    <canvas id="noise-canvas"></canvas>

                    <!-- Weather Particles Container -->
                    <div id="weather-particles"></div>

                    <!-- Screen Content -->
                    <div class="screen-content">
                        <div class="tv-header">
                            <span class="ch-badge" id="ch-badge">CH-03</span>
                            <span class="signal-indicator" id="signal-text">● LIVE SIGNAL</span>
                        </div>

                        <!-- Central Cubic Digital Clock -->
                        <div class="clock-cube-container">
                            <div class="cube-digit-group">
                                <div class="cube-block" id="h1">0</div>
                                <div class="cube-block" id="h2">0</div>
                            </div>
                            <div class="cube-separator">:</div>
                            <div class="cube-digit-group">
                                <div class="cube-block" id="m1">0</div>
                                <div class="cube-block" id="m2">0</div>
                            </div>
                            <div class="cube-separator">:</div>
                            <div class="cube-digit-group">
                                <div class="cube-block" id="s1">0</div>
                                <div class="cube-block" id="s2">0</div>
                            </div>
                        </div>

                        <!-- Date, Phase & Weather Info -->
                        <div class="info-panel">
                            <div class="date-display" id="date-text">LOADING DATE...</div>
                            <div class="phase-badge">
                                <span class="phase-icon" id="phase-icon">🌌</span>
                                <span class="phase-title" id="phase-title">DEEP MIDNIGHT</span>
                            </div>
                            <div class="phase-desc" id="phase-desc">Booting system...</div>
                            
                            <!-- Weather Badge -->
                            <div class="weather-badge" id="weather-badge">
                                <span id="weather-icon">🌧️</span>
                                <span id="weather-text">RETRO RAIN</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TV Controls Sidebar -->
            <div class="tv-controls">
                <div class="brand-logo">RETRO-VISION</div>
                
                <div class="knob-group">
                    <div class="knob" id="knob-tune">
                        <div class="knob-line"></div>
                    </div>
                    <span class="knob-label">TUNE</span>
                </div>

                <div class="knob-group">
                    <div class="knob" id="knob-vol">
                        <div class="knob-line"></div>
                    </div>
                    <span class="knob-label">VOL</span>
                </div>

                <div class="speaker-grille">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>

                <div class="power-button-container">
                    <div class="power-btn" id="power-btn"></div>
                    <span class="power-label">POWER</span>
                </div>
            </div>
        </div>

        <div class="tv-feet">
            <div class="foot left"></div>
            <div class="foot right"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
